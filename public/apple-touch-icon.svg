<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1F3A"/>
      <stop offset="100%" style="stop-color:#141416"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B8CDE"/>
      <stop offset="100%" style="stop-color:#4CAF7D"/>
    </linearGradient>
  </defs>

  <!-- Background rounded -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle glow -->
  <circle cx="380" cy="140" r="180" fill="rgba(123,140,222,0.08)"/>

  <!-- Accent line top left -->
  <rect x="52" y="52" width="5" height="140" rx="3" fill="url(#accent)"/>
  <rect x="52" y="52" width="140" height="5" rx="3" fill="url(#accent)"/>

  <!-- A -->
  <text x="82" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="220" font-weight="800" fill="white" letter-spacing="-8">A</text>

  <!-- C — smaller, accent color, bottom right -->
  <text x="270" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="140" font-weight="300" fill="url(#accent)" letter-spacing="-4">C</text>
</svg>
